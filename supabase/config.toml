# Supabase configuration (used by the Supabase CLI)
# The database migrations in supabase/migrations/ are applied to the remote
# project with `supabase link` + `supabase db push`.
project_id = "hospital-ops-control-tower"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/*"]

[edge_runtime]
enabled = true
port = 54326

[realtime]
enabled = true
